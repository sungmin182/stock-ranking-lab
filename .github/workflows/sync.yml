name: 데이터 동기화 & 배포

on:
  schedule:
    # KRX 일별매매정보는 장 마감(15:30 KST) 뒤에 확정된다. 넉넉히 저녁에 돈다.
    # 10:00 UTC = 19:00 KST. 주말·공휴일은 휴장이라 평일에만 돌린다.
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# ── 수집이 실패해도 배포는 한다 ──────────────────────────
# 시세 수집이 죽으면 워크플로 전체가 멈춰 사이트가 404 로 남는다. 그래서 수집
# 단계는 continue-on-error 로 두고, 빌드가 기존 data/stocks.json 을 그대로
# 내보내게 했다(없으면 저장소에 커밋된 예시 자료가 그 자리에 있다).
#
# 대신 맨 뒤에 report 잡을 두어, 수집이 실패했으면 배포가 끝난 뒤 실행을
# 빨갛게 만든다. 안 그러면 몇 달째 옛 자료가 떠 있는데 뱃지는 초록인 상태가 된다.

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      krx: ${{ steps.krx.outcome }}
      dart: ${{ steps.dart.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 과거 날짜의 시세는 다시 바뀌지 않고, 재무제표는 분기에 한 번만 바뀐다.
      # 캐시를 재사용해 매일 KRX·DART 를 처음부터 다시 때리지 않도록 한다.
      # (DART 는 하루 20,000건 한도가 있어 2,600종목 배당 조회를 매일 하면 아깝다.)
      - name: 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            cache/prices
            cache/dart
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-

      - name: 시세 수집 (KRX)
        id: krx
        continue-on-error: true
        run: node scripts/sync-prices.mjs
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      # 차트용 과거 종가. 지점이 81개라 첫 실행만 오래 걸리고 그다음은 캐시에서 나온다.
      # 없으면 차트만 안 뜨고 나머지는 그대로 돌아간다.
      - name: 과거 종가 수집 (KRX)
        id: history
        continue-on-error: true
        run: node scripts/sync-history.mjs
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      - name: 재무·배당 수집 (DART)
        id: dart
        continue-on-error: true
        run: node scripts/sync-financials.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CONCURRENCY: '3'

      - name: stocks.json 빌드
        run: node scripts/build.mjs

      - name: 수집 결과 요약
        run: |
          {
            echo "### 수집 결과"
            echo ""
            echo "| 단계 | 결과 |"
            echo "| --- | --- |"
            echo "| 시세 (KRX) | ${{ steps.krx.outcome }} |"
            echo "| 과거 종가 (KRX) | ${{ steps.history.outcome }} |"
            echo "| 재무 (DART) | ${{ steps.dart.outcome }} |"
            echo ""
            if [ "${{ steps.krx.outcome }}" != "success" ]; then
              echo "> 시세 수집이 실패해 **기존 data/stocks.json 을 그대로 배포**했습니다."
              echo "> 저장소에 커밋된 것은 예시 자료라, 사이트에 빨간 경고 띠가 뜹니다."
              echo "> \`KRX_API_KEY\` 시크릿이 등록돼 있는지 확인하세요."
            fi
            node -e "const d=require('./data/stocks.json');console.log('');console.log('배포 대상: '+d.count+'종목 · '+(d.sample?'예시 데이터':d.date+' 기준'));"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 아티팩트 준비
        # prices.json / financials.json 은 build 의 입력일 뿐이라 배포하지 않는다.
        #
        # GitHub Pages 는 자산에 max-age=600 을 붙인다. 배포 직후 10분 동안
        # 새 index.html 과 캐시된 옛 app.js 가 섞여 기능이 깨질 수 있으므로,
        # 배포마다 자산 주소에 버전을 붙여 확실히 새로 받게 한다.
        #
        # data/stocks.json 은 여기서 건드리지 않는다. app.js 가 자기 주소의
        # ?v= 를 읽어 데이터 주소에도 같은 번호를 붙이기 때문이다.
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/stocks.json _site/data/
          # 차트 데이터. 화면이 필요할 때만 따로 받으므로 첫 화면을 느리게 하지 않는다.
          [ -f data/history.json ] && cp data/history.json _site/data/ || echo "history.json 없음 — 차트 없이 배포"
          STAMP="${{ github.run_id }}"
          sed -i \
            -e "s|assets/style\.css|assets/style.css?v=$STAMP|g" \
            -e "s|assets/config\.js|assets/config.js?v=$STAMP|g" \
            -e "s|assets/app\.js|assets/app.js?v=$STAMP|g" \
            _site/index.html
          grep -o 'assets/[a-z]*\.[a-z]*?v=[0-9]*' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포는 끝났지만 수집이 실패했으면 실행을 빨갛게 남긴다.
  # 초록 뱃지 뒤에서 자료가 조용히 늙는 것을 막는 장치다.
  report:
    needs: [sync, deploy]
    # sync 가 실제로 끝났을 때만 따진다.
    #
    # always() 만 걸었더니, 동시성 그룹에 밀려 취소된 실행에서도 이 잡이 돌아
    # outputs 가 빈 문자열이라 "시세 수집이 실패했습니다" 를 띄웠다.
    # 취소는 실패가 아니다 — 뒤이은 실행이 자리를 가져갔을 뿐이다.
    if: always() && needs.sync.result != 'cancelled' && needs.sync.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: 수집 실패 여부 확인
        run: |
          echo "시세(KRX): ${{ needs.sync.outputs.krx }}"
          echo "재무(DART): ${{ needs.sync.outputs.dart }}"
          if [ "${{ needs.sync.outputs.krx }}" != "success" ]; then
            echo "::error::시세 수집(KRX)이 실패했습니다. 사이트는 기존 자료로 배포됐습니다."
            exit 1
          fi
          if [ "${{ needs.sync.outputs.dart }}" != "success" ]; then
            echo "::warning::재무 수집(DART)이 실패했습니다. PER·PBR·ROE 칸이 빕니다."
          fi
